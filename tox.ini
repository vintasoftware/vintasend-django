[tox]
requires =
    tox>=4
envlist =
    # Django official Python support
    # Source: https://docs.djangoproject.com/en/6.0/faq/install/#what-python-version-can-i-use-with-django
    py312-{django42,django50,django51,django52,django60}
    py313-{django51,django52,django60}
    py314-{django60}

[gh]
python =
    3.12 = py312-{django42,django50,django51,django52,django60}
    3.13 = py313-{django51,django52,django60}
    3.14 = py314-{django60}

[testenv]
description = run tests
basepython =
    py312: python3.12
    py313: python3.13
    py314: python3.14
deps =
    poetry
    django42: Django>=4.2,<4.3
    django50: Django>=5.0,<5.1
    django51: Django>=5.1,<5.2
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
commands_pre =
    poetry install --with dev
commands =
    poetry run pytest -n auto --cov vintasend_django --cov-report=xml:coverage-{envname}.xml {posargs}